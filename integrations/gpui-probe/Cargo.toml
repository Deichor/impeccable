[package]
name = "impeccable-gpui-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Debug-build bridge between a GPUI app and Impeccable: window captures and live style variants"

# Not a member of the engine workspace: the engine must build without GPUI.

[features]
default = ["gpui-0-2"]
# The crates.io GPUI release apps use today.
gpui-0-2 = ["dep:gpui"]
# Zed's weekly gpui-pre snapshots, which gpui-kit also builds on.
# `font-kit` is the macOS text system; without it GPUI paints no text there.
gpui-pre = ["dep:gpui-pre", "dep:gpui_platform", "gpui_platform/font-kit"]
# Window UI snapshots; needs the new-horizon-code-repo/gpui fork patched in for gpui-pre.
snapshot = ["gpui-pre"]

[dependencies]
gpui = { version = "0.2", optional = true }
gpui-pre = { version = "=0.3.11", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", optional = true }
serde_json = "1"
raw-window-handle = "0.6"
png = "0.17"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
]

# macOS: ScreenCaptureKit captures (loaded at run time, so older systems still
# launch) and in-process pointer events.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGSession", "CGWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSString"] }
block2 = "0.6"

# Linux: X11 capture and XTEST pointer input for gpui 0.2 apps; pure Rust, no libxcb.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["composite", "xtest"] }
# gpui-pre-platform enables no Linux backend by default; without them GPUI runs headless.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", optional = true, features = ["x11", "wayland"] }

[[example]]
name = "demo"

# Building the probe itself (examples, checks) against the fork. Apps add the
# same patch to their own workspace root.
[patch.crates-io]
gpui-pre = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
gpui-pre-macos = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
gpui-pre-apple = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
gpui-pre-wgpu = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
gpui-pre-linux = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
