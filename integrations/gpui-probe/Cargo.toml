[package]
name = "impeccable-gpui-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Debug-build bridge between a GPUI app and Impeccable: window captures and live style variants"

# Not a member of the engine workspace: the engine must build without GPUI.

[features]
default = ["gpui-0-2"]
# The crates.io GPUI release apps use today.
gpui-0-2 = [
    "dep:gpui",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:objc2-screen-capture-kit",
    "dep:block2",
]
# Zed's weekly gpui-pre snapshots, which gpui-kit also builds on.
# `font-kit` is the macOS text system; without it GPUI paints no text there.
gpui-pre = ["dep:gpui-pre", "dep:gpui_platform", "gpui_platform/font-kit"]
# Window UI snapshots; needs the new-horizon-code-repo/gpui fork patched in for gpui-pre.
snapshot = ["gpui-pre"]

[dependencies]
gpui = { version = "0.2", optional = true }
gpui-pre = { version = "=0.3.11", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", optional = true }
serde_json = "1"
raw-window-handle = "0.6"
png = "0.17"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
]

# gpui 0.2 on macOS: ScreenCaptureKit captures and in-process pointer events.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGSession", "CGWindow"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSString"] }
objc2-screen-capture-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager", "SCShareableContent", "SCStream"] }
block2 = { version = "0.6", optional = true }

[[example]]
name = "demo"

# Building the probe itself (examples, checks) against the fork. Apps add the
# same patch to their own workspace root.
[patch.crates-io]
gpui-pre = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
gpui-pre-macos = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
gpui-pre-apple = { git = "https://github.com/new-horizon-code-repo/gpui", branch = "main" }
